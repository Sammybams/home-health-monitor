[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-health-monitor"
version = "0.1.0"
description = "Tiny, dependency-free edge inference for home vital-sign trends"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gateway = ["numpy>=1.24,<3"]
gateway-pi = [
    "numpy>=1.24,<3",
    "ai-edge-litert>=2.2,<3",
]
gateway-train = [
    "numpy>=1.24,<3",
    "tensorflow>=2.15,<3; python_version < '3.13'",
]
analysis = ["matplotlib>=3.7,<4"]
notebook = [
    "ipykernel>=6,<8",
    "nbclient>=0.10,<1",
    "nbconvert>=7,<8",
    "nbformat>=5.9,<6",
]

[project.scripts]
home-health-monitor = "home_health_monitor.__main__:main"
home-health-gateway-train = "home_health_monitor.gateway.training:main"
home-health-dataset-audit = "home_health_monitor.datasets.audit:main"
home-health-development-data = "home_health_monitor.datasets.development:main"
home-health-data-evidence = "home_health_monitor.datasets.evidence:main"
home-health-development-report = "home_health_monitor.reporting:main"

[tool.setuptools.packages.find]
where = ["src"]
