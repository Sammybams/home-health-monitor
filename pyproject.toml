[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "home-health-monitor"
version = "0.1.0"
description = "Tiny, dependency-free edge inference for home vital-sign trends"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gateway = ["numpy>=1.24,<3"]
gateway-train = [
    "numpy>=1.24,<3",
    "tensorflow>=2.15,<3; python_version < '3.13'",
]

[project.scripts]
home-health-monitor = "home_health_monitor.__main__:main"
home-health-gateway-train = "home_health_monitor.gateway.training:main"
home-health-dataset-audit = "home_health_monitor.datasets.audit:main"
home-health-development-data = "home_health_monitor.datasets.development:main"

[tool.setuptools.packages.find]
where = ["src"]
